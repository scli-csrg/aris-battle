name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Export paper traces
        run: python scripts/run_paper_experiments.py --out results

