[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aris-battle"
version = "0.1.0"
description = "Reference simulations for edge-intelligent acoustic RIS battles in underwater vehicular networks."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Author Name(s)"}
]
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

